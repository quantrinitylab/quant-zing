<!DOCTYPE html>

    <style>
      html,
      body {

        color: #e7e9ea;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .ops-boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #000000;
        color: #71767b;
        font-size: 13px;
        letter-spacing: 0.02em;
      }
    </style>
    <script>
      ;(function () {
        var pathname = window.location.pathname || '/'
        var base = pathname === '/ops' || pathname.indexOf('/ops/') === 0 ? '/ops/' : '/'
        window.__QZ_OPS_BASE__ = base
        var link = document.createElement('link')
        link.rel = 'stylesheet'
        link.href = base + 'styles.css'
        document.head.appendChild(link)
        var script = document.createElement('script')
        script.src = base + 'app.js'
        script.async = false
        script.defer = true
        document.head.appendChild(script)
      })()
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding: 32px; text-align: center; color: #e7e9ea; background: #000000;">
        JavaScript is required to access QuantZing Ops.

    <div id="app" class="ops-app-root">
      <div class="ops-boot-splash">
        <svg width="44" height="44" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="60" height="60" rx="16" fill="#000000" stroke="#2F3336" stroke-width="2" />
          <path fill="#FFFFFF" d="M15 15H49V21L27 42H49V49H15V43L37 22H15Z" />
          <path fill="#1D9BF0" d="M23 29.5H46L41 34.5H18Z" />

    <div id="modal-root" class="ops-modal-root" aria-hidden="true"></div>
    <div id="toast-root" class="ops-toast-root" aria-live="polite" aria-atomic="true"></div>
