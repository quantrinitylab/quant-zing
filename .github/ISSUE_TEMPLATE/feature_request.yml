name: "Feature Request"
description: "Suggest an idea or enhancement for the QuantZing app (quantzing.com)."
labels: ["feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting a feature request to QuantZing (`quantrinitylab/quant-zing`)! Before submitting, please check whether a similar request is already open so we can keep discussion consolidated in one place.
  - type: textarea
    attributes:
      label: Describe the Feature
      description: |
        Please provide a detailed description of the feature or improvement you would like to see in QuantZing (e.g., Zings, Rezings, Quote Zings, Quanty / `@quanty` thread replies, ZingSpaces audio rooms, Articles Studio, Creator Studio 70/30 monetization, or QuantZing Pro).
    validations:
      required: true
  - type: upload
    attributes:
      label: Attachments
      description: |
        If helpful, attach wireframes, screenshots, or videos showing how the feature should work or where in QuantZing it belongs.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"
  - type: textarea
    attributes:
      label: Describe Alternatives
      description: |
        If there are alternative approaches or workflows you have considered, please describe them here.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional Context
      description: |
        Add any other context or technical notes about the feature request here.
    validations:
      required: false
