name: "Bug Report - Fabric/New Architecture"
description: "Create a bug report for QuantZing native builds using the React Native New Architecture."
labels: ["bug", "fabric"]
body:
  - type: checkboxes
    attributes:
      label: You are running a QuantZing build that uses the React Native New Architecture, right?
      description: This template is specifically for issues related to native QuantZing builds (`com.quantzing.app`) using the React Native New Architecture. Otherwise, please use the default Bug Report template.
      options:
        - label: I am running a QuantZing build that uses the New Architecture
          required: true
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue in QuantZing (`quantrinitylab/quant-zing`)! Before submitting, please make sure you have searched for similar open issues.
  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: |
        Please provide concise steps that reproduce the issue you are experiencing in QuantZing.
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: upload
    attributes:
      label: Attachments
      description: |
        If possible, please provide any images or videos that help illustrate the issue.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"
  - type: dropdown
    attributes:
      label: What platform(s) does this occur on?
      multiple: true
      options:
        - iOS
        - Android
    validations:
      required: true
  - type: input
    attributes:
      label: Device Info
      description: |
        Please provide the device model and operating system version you are using when experiencing this issue.
    validations:
      required: false
  - type: input
    attributes:
      label: What version of QuantZing are you using?
      description: |
        You can find this information by visiting the Settings screen in QuantZing and tapping on the version info at the bottom of the screen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional Information
      description: |
        Please provide any crash logs, stack traces, or additional details that may help us identify the issue.
    validations:
      required: false
