name: "Bug Report"
description: "Create a report for an issue you have experienced in the QuantZing app (quantzing.com)."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue you have found in QuantZing! Before submitting this issue to `quantrinitylab/quant-zing`, please search for existing open issues. If you find an open issue that matches yours, leave a comment there with your reproduction details instead of opening a duplicate issue.
  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: |
        Please provide the steps that reproduce the issue in QuantZing (e.g., publishing a Zing, Rezinging, mentioning @quanty, joining ZingSpaces, or using Articles Studio / Creator Studio).
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: upload
    attributes:
      label: Attachments
      description: |
        If possible, please provide any screenshots or screen recordings that help illustrate the issue.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"
  - type: dropdown
    attributes:
      label: What platform(s) does this occur on?
      multiple: true
      options:
        - iOS
        - Android
        - Web (Desktop - quantzing.com)
        - Web (Mobile - quantzing.com)
    validations:
      required: true
  - type: input
    attributes:
      label: Device Info
      description: |
        Please provide the device model, operating system version, and browser (if on Web) where you experienced this issue.
    validations:
      required: false
  - type: input
    attributes:
      label: What version of the QuantZing app are you using?
      description: |
        You can find this information by visiting the Settings screen in QuantZing and checking the version info at the bottom of the screen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional Information
      description: |
        Please provide any additional context, console logs, XRPC response codes, or handle details (`@handle.quantzing.com`) that may help us diagnose the issue.
    validations:
      required: false
