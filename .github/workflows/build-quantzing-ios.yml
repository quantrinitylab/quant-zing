name: Build QuantZing iOS (Simulator & Signed IPA)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'iOS Build Mode (simulator requires zero Apple secrets; ipa-signed requires Apple Developer secrets)'
        required: true
        default: 'simulator'
        type: choice
        options:
          - simulator
          - ipa-signed
      submit_testflight:
        description: 'Upload signed .ipa to App Store Connect / TestFlight (ipa-signed mode only)'
        required: false
        default: false
        type: boolean
      quantzing_url:
        description: 'Production QuantZing AppView & PDS URL'
        required: true
        default: 'https://quantzing.quantrinity.in'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_ENV: production
  EXPO_PUBLIC_QUANTZING_URL: ${{ inputs.quantzing_url || 'https://quantzing.quantrinity.in' }}
  EXPO_PUBLIC_QUANTZING_DOMAIN: quantzing.com
  DISABLE_UPDATES: '1'
  NODE_ENV: production
  EXPO_NO_GIT_STATUS: '1'

jobs:
  build-ios:
    name: QuantZing iOS (${{ inputs.build_mode || 'simulator' }})
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout QuantZing repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '24.7.0'

      - name: Enable Corepack & pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify sovereign iOS app.config.js & TypeScript
        env:
          EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
        run: |
          node -e "
            const rawCfg = require('./app.config.js')({});
            const cfg = rawCfg.expo || rawCfg;
            if (cfg.ios.bundleIdentifier !== 'com.quantzing.app') {
              throw new Error('Unexpected bundleIdentifier: ' + cfg.ios.bundleIdentifier);
            }
            const raw = JSON.stringify(cfg);
            if (raw.includes('B3LX46C5HS') || raw.includes('group.app.bsky') || raw.includes('xyz.blueskyweb.app')) {
              throw new Error('Sovereignty check failed in app.config.js');
            }
            console.log('Verified iOS config:', cfg.name, cfg.ios.bundleIdentifier, 'plugins:', cfg.plugins.length);
          "
          pnpm run typecheck:ios

      - name: Run Expo Prebuild for iOS
        env:
          EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
        run: |
          pnpm exec expo prebuild --platform ios --clean
          if grep -R -E "B3LX46C5HS|group\.app\.bsky" ios/; then
            echo "ERROR: Legacy app group or team ID found in generated ios/ project!"
            exit 1
          fi

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Build Unsigned Release iOS Simulator .app (Zero-Secret Verification)
        if: ${{ (inputs.build_mode || 'simulator') == 'simulator' }}
        run: |
          WORKSPACE_PATH=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)
          echo "Building workspace=$WORKSPACE_PATH scheme=$SCHEME_NAME for iphonesimulator..."
          xcodebuild \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
          APP_PATH=$(find ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Compiled Simulator .app not found!"
            exit 1
          fi
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/QuantZing-iOS-Simulator.app.zip
          ls -lh artifacts/QuantZing-iOS-Simulator.app.zip

      - name: Upload iOS Simulator .app Artifact
        if: ${{ (inputs.build_mode || 'simulator') == 'simulator' }}
        uses: actions/upload-artifact@v4
        with:
          name: QuantZing-iOS-Simulator
          path: artifacts/QuantZing-iOS-Simulator.app.zip
          retention-days: 30

      - name: Build Signed Production .ipa via EAS Local Build
        if: ${{ inputs.build_mode == 'ipa-signed' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
        run: |
          if [ -z "$EXPO_APPLE_TEAM_ID" ]; then
            echo "ERROR: EXPO_APPLE_TEAM_ID secret is required for signed .ipa builds."
            exit 1
          fi
          mkdir -p artifacts
          npx --yes eas-cli@latest build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --output artifacts/QuantZing.ipa
          ls -lh artifacts/QuantZing.ipa

      - name: Upload Signed QuantZing.ipa Artifact
        if: ${{ inputs.build_mode == 'ipa-signed' }}
        uses: actions/upload-artifact@v4
        with:
          name: QuantZing-iOS-IPA
          path: artifacts/QuantZing.ipa
          retention-days: 30

      - name: Submit Signed .ipa to App Store Connect / TestFlight
        if: ${{ inputs.build_mode == 'ipa-signed' && inputs.submit_testflight == true }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "ERROR: ASC_KEY_ID, ASC_ISSUER_ID, and ASC_KEY_P8_BASE64 secrets are required for TestFlight submission."
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app \
            --type ios \
            --file artifacts/QuantZing.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
