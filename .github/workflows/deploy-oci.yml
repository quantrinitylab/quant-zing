name: Deploy QuantZing to Oracle Cloud (OCI)

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Target domain (default: quantzing.quantrinity.in)'
        required: false
        default: 'quantzing.quantrinity.in'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build Sovereign Web Bundle & Deploy to vm-quantzing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile locales & run syntax/TypeScript checks
        run: |
          pnpm intl:compile
          node --check ./scripts/quantzing-pds.mjs
          node --check ./scripts/quantzing-store.mjs
          node --check ./scripts/quantzing-quanty.mjs
          node --check ./scripts/serve-quantzing.mjs
          node --check ./scripts/quantzing-admin.mjs
          node --check ./deploy/quantzing-adapter.mjs
          node --check ./ops-portal/app.js
          bash -n ./deploy/backup-quantzing.sh
          bash -n ./deploy/monitor-quantzing.sh
          bash -n ./deploy/setup-oci-hardening.sh
          pnpm exec tsc --noEmit --project ./tsconfig.check.web.json

      - name: Build QuantZing production web bundle
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          pnpm exec expo export --platform web --max-workers 2
          node ./scripts/post-web-build.js
          tar -czf /tmp/quantzing-release.tar.gz \
            dist \
            ops-portal \
            scripts/serve-quantzing.mjs \
            scripts/quantzing-pds.mjs \
            scripts/quantzing-store.mjs \
            scripts/quantzing-quanty.mjs \
            scripts/quantzing-admin.mjs \
            deploy/quantzing-adapter.mjs \
            deploy/backup-quantzing.sh \
            deploy/monitor-quantzing.sh \
            deploy/logrotate-quantzing \
            deploy/setup-oci-hardening.sh \
            deploy/systemd \
            assets/app-icons/android_icon_default_next.png \
            assets/app-icons/ios_icon_default_next.png \
            assets/favicon.png \
            package.json

      - name: Deploy to Oracle Cloud vm-quantzing
        env:
          SSH_KEY: ${{ secrets.QUANTZING_OCI_SSH_KEY }}
          VM_IP: ${{ vars.QUANTZING_VM_IP || '130.210.86.242' }}
          SSH_USER: ${{ vars.QUANTZING_SSH_USER || 'ubuntu' }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "Skipping OCI SSH deploy (QUANTZING_OCI_SSH_KEY secret is not configured)."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/quantzing_oci
          chmod 600 ~/.ssh/quantzing_oci
          scp -i ~/.ssh/quantzing_oci -o StrictHostKeyChecking=no /tmp/quantzing-release.tar.gz "$SSH_USER@$VM_IP:/tmp/quantzing-release.tar.gz"
          ssh -i ~/.ssh/quantzing_oci -o StrictHostKeyChecking=no "$SSH_USER@$VM_IP" "
            set -euo pipefail
            sudo mkdir -p /opt/quantzing
            sudo tar -xzf /tmp/quantzing-release.tar.gz -C /opt/quantzing --no-same-owner
            sudo chown -R $SSH_USER:$SSH_USER /opt/quantzing
            rm -f /tmp/quantzing-release.tar.gz
            chmod +x /opt/quantzing/deploy/backup-quantzing.sh /opt/quantzing/deploy/monitor-quantzing.sh /opt/quantzing/deploy/setup-oci-hardening.sh
            sudo systemctl restart quantzing
            sleep 2
            curl -fsS http://127.0.0.1:3008/health
          "
