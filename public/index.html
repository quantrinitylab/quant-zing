<!DOCTYPE html>
<html class="theme--dark">
  <head>
    <meta charset="utf-8">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="QuantZing">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='16' fill='%23000000' stroke='%232F3336' stroke-width='2'/%3E%3Cpath fill='%23FFFFFF' d='M15 15H49V21L27 42H49V49H15V43L37 22H15Z'/%3E%3Cpath fill='%231D9BF0' d='M23 29.5H46L41 34.5H18Z'/%3E%3C/svg%3E">
    <title>QuantZing</title>
    <meta name="description" content="QuantZing — Real-time conversation, news, and Quanty." />

    <link rel="preload" as="font" type="font/woff2" href="/assets/assets/fonts/inter/InterVariable.woff2" crossorigin>

    <style>
      @font-face {
        font-family: 'InterVariable';
        src: url(/assets/assets/fonts/inter/InterVariable.woff2) format('woff2');
        font-weight: 300 1000;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'InterVariableItalic';
        src: url(/assets/assets/fonts/inter/InterVariable-Italic.woff2) format('woff2');
        font-weight: 300 1000;
        font-style: italic;
        font-display: swap;
      }
      html,
      body {
        margin: 0px;
        padding: 0px;
        font-family: InterVariable, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Liberation Sans', Helvetica, Arial, sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-overflow-scrolling: touch;
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -ms-overflow-style: scrollbar;
        font-synthesis-weight: none;
      }
      :root {
        color-scheme: dark;
        --text: #E7E9EA;
        --background: #000000;
        --backgroundLight: #16181C;
      }
      html,
      body,
      #root {
        display: flex;
        flex: 1 0 auto;
        min-height: 100%;
        width: 100%;
      }
      html.theme--light,
      html.theme--light body,
      html.theme--light #root {
        color-scheme: light;
        background-color: #FFFFFF;
        --text: #0F1419;
        --background: #FFFFFF;
        --backgroundLight: #F7F9F9;
      }
      html.theme--dark,
      html.theme--dark body,
      html.theme--dark #root {
        color-scheme: dark;
        background-color: #000000;
        --text: #E7E9EA;
        --background: #000000;
        --backgroundLight: #16181C;
      }
      html.theme--dim,
      html.theme--dim body,
      html.theme--dim #root {
        color-scheme: dark;
        background-color: #15202B;
        --text: #F7F9F9;
        --background: #15202B;
        --backgroundLight: #1E2732;
      }
      @keyframes qz-splash-pulse {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(0.95);
        }
      }
      #qz-boot-splash {
        display: flex;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        background-color: #000000;
        z-index: 1;
      }
      #qz-boot-splash svg {
        width: 76px;
        height: 76px;
        animation: qz-splash-pulse 1.5s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        #qz-boot-splash svg {
          animation: none;
        }
      }
      body {
        width: 100%;
        overflow-y: scroll;
      }
    </style>
    <script>
      const theme = localStorage.getItem('ALF_THEME') || 'dark'
      document.documentElement.classList.remove('theme--light', 'theme--dark', 'theme--dim')
      document.documentElement.classList.add(`theme--${theme}`)
    </script>
  </head>

  <body>
    <noscript>
      <form
        action=""
        style="
          background-color: #000000;
          color: #E7E9EA;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 9999;
        "
      >
        <div
          style="
            font-size: 18px;
            font-family: InterVariable, Helvetica, sans-serif;
            line-height: 24px;
            margin: 10%;
            width: 80%;
          "
        >
          <h1 lang="en">QuantZing</h1>
          <p lang="en">Real-time conversation, news, and Quanty.</p>
          <div data-nosnippet>
            <p lang="en">Enable JavaScript to use QuantZing.</p>
            <p lang="en" style="margin: 20px 0;">
              <button
                type="submit"
                style="
                  background-color: #EFF3F4;
                  border-radius: 100px;
                  border: none;
                  box-shadow: none;
                  color: #0F1419;
                  cursor: pointer;
                  font-weight: bold;
                  line-height: 20px;
                  padding: 8px 20px;
                "
              >
                Reload
              </button>
            </p>
          </div>
        </div>
      </form>
    </noscript>

    <div id="root">
      <div id="qz-boot-splash" role="status" aria-label="Loading QuantZing">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="76" height="76">
          <rect x="2" y="2" width="60" height="60" rx="16" fill="#000000" stroke="#2F3336" stroke-width="2"/>
          <path fill="#FFFFFF" d="M15 15H49V21L27 42H49V49H15V43L37 22H15Z"/>
          <path fill="#1D9BF0" d="M23 29.5H46L41 34.5H18Z"/>
        </svg>
      </div>
    </div>
  </body>
</html>
